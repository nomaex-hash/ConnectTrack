  <script>
(() => {
  if (typeof navigator !== 'undefined') {
    try {
      if (typeof navigator.getGamepads === 'function') {
        // Gọi thử để xem có bị Permissions Policy chặn không
        navigator.getGamepads();
      }
    } catch (e) {
      // Bị chặn -> thay bằng hàm an toàn trả về mảng rỗng
      try {
        Object.defineProperty(navigator, 'getGamepads', {
          value: () => [],
          configurable: true
        });
        console.log('[patch] getGamepads() is blocked by policy; returning [].');
      } catch (_e) {
        // Trình duyệt không cho override (hiếm)
        console.warn('[patch] Unable to override navigator.getGamepads.');
      }
    }
  }
})();
</script>

    window["phase"] = "fb_init";
    window.focus();

    window.__fbInstantLoadingTimer = setInterval((
      function () {
        FBInstant.setLoadingProgress(n++), n >= 99 && clearInterval(window
          .__fbInstantLoadingTimer)
      }), 80)
  })).catch((e)=>{
      setTimeout(initFbInstant, 1000);
  })
}
